name: Checks
on: [push, pull_request]
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint:js
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zlib
      - run: composer install --no-interaction --prefer-dist
      - run: php examples/generate-assets.php && git diff --exit-code -- examples/assets
      - run: composer test
      - name: Check ECS benchmark workloads
        run: php benchmarks/ecs.php --entities=1000 --samples=1 --iterations=1 > "$RUNNER_TEMP/ecs-benchmark.json"
      - run: composer lint
  tiled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Tiled 1.12.2
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libxkbcommon-x11-0 libxcb-cursor0
          mkdir -p "$RUNNER_TEMP/tiled"
          cd "$RUNNER_TEMP/tiled"
          curl --fail --location --retry 3 https://github.com/mapeditor/tiled/releases/download/v1.12.2/Tiled-1.12.2_Linux_x86_64.AppImage -o Tiled.AppImage
          echo "5e0edbff61314f41af3c72c21ec006b363cf12047cc9cfb5bbd63a98bca3721c  Tiled.AppImage" | sha256sum --check
          chmod +x Tiled.AppImage
          ./Tiled.AppImage --appimage-extract > /dev/null
          echo "TILED_BIN=$RUNNER_TEMP/tiled/squashfs-root/AppRun" >> "$GITHUB_ENV"
      - run: xvfb-run -a npm run test:tiled
        env:
          QT_QPA_PLATFORM: xcb
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run setup:runtime
      - run: npm run test:browser
