name: Checks
on: [push, pull_request]
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint:js
      - run: npm run test:packages
      - run: npm run test:cli
      - run: npm run test:generated
      - run: npm run build:manifests && git diff --exit-code -- phonics.json packages tests/fixtures
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zlib
      - run: composer install --no-interaction --prefer-dist
      - run: php packages/sane-phonics/examples/generate-assets.php && git diff --exit-code -- packages/sane-phonics/examples/assets resources
      - run: composer test
      - name: Check ECS benchmark workloads
        run: php benchmarks/ecs.php --entities=1000 --samples=1 --iterations=1 > "$RUNNER_TEMP/ecs-benchmark.json"
      - name: Check PHP-Noid collision workloads
        run: php packages/php-noid/benchmarks/collisions.php --samples=1 --iterations=2 > "$RUNNER_TEMP/php-noid-collisions-native.json"
      - name: Check PHPTris board workloads
        run: npm run bench:php-tris
      - run: composer lint
  tiled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm link --workspace @seanmorris/tiled-phonics
      - name: Install Tiled 1.12.2
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libxkbcommon-x11-0 libxcb-cursor0
          mkdir -p "$RUNNER_TEMP/tiled"
          cd "$RUNNER_TEMP/tiled"
          curl --fail --location --retry 3 https://github.com/mapeditor/tiled/releases/download/v1.12.2/Tiled-1.12.2_Linux_x86_64.AppImage -o Tiled.AppImage
          echo "5e0edbff61314f41af3c72c21ec006b363cf12047cc9cfb5bbd63a98bca3721c  Tiled.AppImage" | sha256sum --check
          chmod +x Tiled.AppImage
          ./Tiled.AppImage --appimage-extract > /dev/null
          echo "TILED_BIN=$RUNNER_TEMP/tiled/squashfs-root/AppRun" >> "$GITHUB_ENV"
      - run: xvfb-run -a npm run test:tiled
        env:
          QT_QPA_PLATFORM: xcb
      - run: xvfb-run -a npm run test:editor
        env:
          QT_QPA_PLATFORM: xcb
  browser:
    name: browser (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: ./.github/actions/setup-docs
      - run: npm run setup:runtime
      - run: npm run test:browser -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          PHONICS_TEST: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
  browser-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: ./.github/actions/setup-docs
      - run: npm run setup:runtime
      - run: npm run test:cli:browser
      - name: Measure PHP-Noid collisions in PHP-WASM
        run: node scripts/bench-php-noid-browser.mjs > "$RUNNER_TEMP/php-noid-collisions.json"
      - name: Measure PHPTris board phases in PHP-WASM
        run: npm run bench:php-tris:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: php-noid-performance
          path: ${{ runner.temp }}/php-noid-collisions.json
      - run: npm run build:docs
      - run: npm run test:site
      - run: npm run test:site:browser
        env:
          DEBUG: pw:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-test-results
          path: test-results/
          if-no-files-found: ignore

  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip
      - run: npm ci
      - run: npm run test:artifacts
