<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Three collision layers and three directional gates form an open loop</title>
  <desc id="desc">An eight by eight tile circle has two shared crown rows. Its remaining left and right halves belong to collision layers one and two. Normal entrance gates sit outside both walls, and a reversed gate straddles the top center.</desc>
  <defs>
    <path id="ring" d="M128 80H384V336H128Z M256 80A128 128 0 1 0 256 336A128 128 0 1 0 256 80Z" fill-rule="evenodd"/>
    <clipPath id="crown"><path d="M128 80H384V144H128Z"/></clipPath>
    <clipPath id="left"><path d="M128 144H256V336H128Z"/></clipPath>
    <clipPath id="right"><path d="M256 144H384V336H256Z"/></clipPath>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse" y="16"><path d="M0 32V0H32" fill="none" stroke="#fff" stroke-opacity=".18"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#f6df9b"/></marker>
  </defs>
  <rect width="960" height="420" rx="12" fill="#142335"/>
  <g font-family="system-ui,sans-serif" font-size="16" fill="#eef6ff">
    <text x="32" y="32" font-weight="600">8 × 8 tiles · 32 px each · circle diameter 256 px</text>
    <use href="#ring" fill="#89a8aa" clip-path="url(#crown)"/>
    <use href="#ring" fill="#62adf2" clip-path="url(#left)"/>
    <use href="#ring" fill="#e49c73" clip-path="url(#right)"/>
    <path d="M32 336H480V368H32Z" fill="#89a8aa"/>
    <path d="M128 80H384V336H128Z" fill="url(#grid)"/>
    <g fill="#cadd9c" fill-opacity=".12" stroke="#cadd9c" stroke-width="2" stroke-dasharray="5 4">
      <rect x="64" y="64" width="32" height="288"/>
      <rect x="416" y="64" width="32" height="288"/>
      <rect x="240" y="56" width="32" height="64"/>
    </g>
    <g fill="none" stroke="#f6df9b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M32 320H256A112 112 0 0 0 368 208A112 112 0 0 0 284 99"/>
      <path d="M227 100A112 112 0 0 0 144 208A112 112 0 0 0 256 320H475"/>
    </g>
    <text x="187" y="205">Loop interior</text>
    <text x="173" y="230" font-size="14" fill="#afc1d3">The inactive half is passable.</text>
    <text x="40" y="396" font-size="14">Dashed rectangles: layer-switch objects (body center enters).</text>
    <g transform="translate(520 80)">
      <rect width="18" height="18" fill="#89a8aa"/><text x="30" y="15">Collision 0: shared crown and floor</text>
      <rect y="38" width="18" height="18" fill="#62adf2"/><text x="30" y="53">Collision 1: lower left half</text>
      <rect y="76" width="18" height="18" fill="#e49c73"/><text x="30" y="91">Collision 2: lower right half</text>
      <text y="148" font-weight="600">Moving right along the floor</text>
      <text y="176">Left gate → 2 · crown → 1 · exit → 2</text>
      <text y="218" font-weight="600">Moving left along the floor</text>
      <text y="246">Right gate → 1 · crown → 2 · exit → 1</text>
      <text y="294" font-size="14" fill="#afc1d3">The crown gate sets back=true.</text>
      <text y="316" font-size="14" fill="#afc1d3">Direction follows ground speed around the loop.</text>
    </g>
  </g>
</svg>
